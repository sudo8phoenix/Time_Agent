services:
  db:
    image: postgres:16.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: progress
      POSTGRES_USER: progress
      POSTGRES_PASSWORD: progress
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U progress -d progress"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
