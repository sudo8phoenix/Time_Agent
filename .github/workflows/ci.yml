name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: progress
          POSTGRES_PASSWORD: progress
          POSTGRES_DB: progress_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U progress -d progress_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Unit tests
        run: pytest backend/tests/unit -q
      - name: Shared login limiter integration tests
        env:
          DATABASE_URL: postgresql+psycopg://progress:progress@127.0.0.1:5432/progress_test
          PYTHONPATH: backend
        run: |
          alembic upgrade head
          pytest backend/tests/integration/test_shared_login_limiter.py -q
      - name: Build isolated parser image
        run: docker compose build parser
      - name: Verify Docker parser confinement
        run: |
          docker compose up -d --wait parser
          PARSER_TEST_CONTAINER=$(docker compose ps -q parser) pytest backend/tests/container -q
      - name: Stop parser test container
        if: always()
        run: docker compose stop parser
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build
